services:
  - type: web
    name: taobao-product-api
    env: node
    region: singapore          # 新加坡区域：海外IP，与1688/JD方案一致
    plan: free                 # 免费方案（512MB内存，15分钟无访问会休眠）
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /health   # 健康检查端点（Render必需，server.js已实现）
    autoDeploy: true           # main分支推送自动部署
    envVars:
      - key: NODE_VERSION
        value: "20.11.0"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8000"
      # 必需：淘宝登录Cookie（浏览器登录淘宝后 F12→Application→Cookies 复制全部）
      # 淘宝2026年起强制登录墙，无登录Cookie无法获取商品详情数据
      # - key: TAOBAO_COOKIE
      #   value: ""
    # 免费方案注意事项：
    # 1. 15分钟无访问会自动休眠，下次访问冷启动约30-60秒
    # 2. 休眠时代理池自动刷新定时器会停止，唤醒后服务启动会重新初始化
    # 3. 如需7×24不间断运行，请升级到 Starter 方案（$7/月）
